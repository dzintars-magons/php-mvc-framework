services:
  php:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    ports:
      - "8000:80"
    volumes:
      - ../:/var/www/html
    container_name: php84-web
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: php84-mysql
    restart: always
    environment:
       MYSQL_ROOT_PASSWORD: rootpass
       MYSQL_DATABASE: product_db
       MYSQL_USER: product_db_user
       MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
